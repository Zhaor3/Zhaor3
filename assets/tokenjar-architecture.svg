<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TokenJar firmware architecture</title>
  <desc id="desc">Architecture diagram showing setup portal, ESP32-S3 firmware, API refresh task, LVGL UI, NVS cache, and provider integrations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#16120F"/>
    </linearGradient>
    <linearGradient id="panel" x1="100" y1="130" x2="1100" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2933"/>
    </linearGradient>
    <style>
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .muted { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #CBD5E1; }
      .card { fill: #0F172A; stroke: #334155; stroke-width: 2; }
      .card2 { fill: #111827; stroke: #475569; stroke-width: 2; }
      .accent { fill: #F97316; }
      .cyan { stroke: #22D3EE; }
      .orange { stroke: #FB923C; }
      .green { stroke: #34D399; }
      .line { stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #94A3B8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="70" y="76" class="title" font-size="42" font-weight="800">TokenJar Architecture</text>
  <text x="70" y="112" class="muted" font-size="18">ESP32-S3 firmware for real-time AI API usage tracking</text>

  <rect x="70" y="145" width="1060" height="560" rx="30" fill="url(#panel)"/>

  <g transform="translate(110 205)">
    <rect class="card" width="230" height="116" rx="18"/>
    <text x="24" y="38" class="title" font-size="20" font-weight="800">First boot</text>
    <text x="24" y="68" class="small" font-size="15">Captive portal</text>
    <text x="24" y="92" class="small" font-size="15">WiFi + API credentials</text>
  </g>

  <g transform="translate(110 405)">
    <rect class="card" width="230" height="116" rx="18"/>
    <text x="24" y="38" class="title" font-size="20" font-weight="800">Runtime input</text>
    <text x="24" y="68" class="small" font-size="15">EC11 encoder</text>
    <text x="24" y="92" class="small" font-size="15">Press, rotate, long press</text>
  </g>

  <g transform="translate(430 190)">
    <rect class="card2" width="320" height="155" rx="22"/>
    <text x="26" y="40" class="title" font-size="22" font-weight="800">ESP32-S3 firmware</text>
    <text x="26" y="72" class="small" font-size="15">State machine: splash, portal,</text>
    <text x="26" y="96" class="small" font-size="15">connecting, running, menus</text>
    <text x="26" y="122" class="small" font-size="15">mDNS: tokenjar.local + OTA</text>
  </g>

  <g transform="translate(430 410)">
    <rect class="card2" width="320" height="155" rx="22"/>
    <text x="26" y="40" class="title" font-size="22" font-weight="800">LVGL display loop</text>
    <text x="26" y="72" class="small" font-size="15">Core 1 UI screens</text>
    <text x="26" y="96" class="small" font-size="15">Provider ring + plan screens</text>
    <text x="26" y="122" class="small" font-size="15">Backlight dimming + cache fallback</text>
  </g>

  <g transform="translate(840 165)">
    <rect class="card" width="230" height="96" rx="18"/>
    <text x="22" y="35" class="title" font-size="18" font-weight="800">Admin APIs</text>
    <text x="22" y="62" class="small" font-size="14">Anthropic + OpenAI</text>
  </g>

  <g transform="translate(840 300)">
    <rect class="card" width="230" height="96" rx="18"/>
    <text x="22" y="35" class="title" font-size="18" font-weight="800">Session usage</text>
    <text x="22" y="62" class="small" font-size="14">Claude.ai + ChatGPT/Codex</text>
  </g>

  <g transform="translate(840 435)">
    <rect class="card" width="230" height="96" rx="18"/>
    <text x="22" y="35" class="title" font-size="18" font-weight="800">NVS storage</text>
    <text x="22" y="62" class="small" font-size="14">Secrets, budgets, snapshots</text>
  </g>

  <g transform="translate(840 570)">
    <rect class="card" width="230" height="96" rx="18"/>
    <text x="22" y="35" class="title" font-size="18" font-weight="800">ST7789 LCD</text>
    <text x="22" y="62" class="small" font-size="14">240 x 320 SPI display</text>
  </g>

  <path class="line cyan" d="M340 260 C375 260 390 250 430 250"/>
  <path class="line orange" d="M340 465 C380 465 390 490 430 490"/>
  <path class="line cyan" d="M750 235 C790 220 800 210 840 210"/>
  <path class="line cyan" d="M750 258 C795 300 805 342 840 345"/>
  <path class="line green" d="M600 345 C640 380 690 430 840 480"/>
  <path class="line orange" d="M750 490 C790 585 795 618 840 620"/>

  <rect x="430" y="615" width="320" height="40" rx="20" fill="#1E293B"/>
  <circle cx="458" cy="635" r="6" class="accent"/>
  <text x="478" y="641" class="muted" font-size="15">API task wakes every 60s; plan screens every 5min</text>
</svg>
