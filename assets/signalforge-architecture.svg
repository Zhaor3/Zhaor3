<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SignalForge AI architecture</title>
  <desc id="desc">Layered architecture showing Telegram and FastAPI entry points, services, quant modules, risk manager, AI explainer, data providers, cache, and database.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E8F7F2"/>
    </linearGradient>
    <linearGradient id="dark" x1="80" y1="72" x2="1110" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10233A"/>
      <stop offset="1" stop-color="#132E32"/>
    </linearGradient>
    <style>
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #0F172A; }
      .labelLight { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .muted { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #64748B; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .boxDark { fill: #142238; stroke: #334155; stroke-width: 2; }
      .arrow { stroke: #0F766E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#page)"/>
  <text x="70" y="70" class="label" font-size="40" font-weight="800">Architecture</text>
  <text x="70" y="108" class="muted" font-size="18">Quant calculates. AI explains. User decides.</text>

  <rect x="70" y="145" width="1060" height="555" rx="28" fill="url(#dark)"/>

  <g transform="translate(110 190)">
    <rect class="box" x="0" y="0" width="220" height="80" rx="18"/>
    <text class="label" x="24" y="34" font-size="18" font-weight="800">Telegram</text>
    <text class="muted" x="24" y="58" font-size="14">Commands + natural text</text>
  </g>
  <g transform="translate(110 305)">
    <rect class="box" x="0" y="0" width="220" height="80" rx="18"/>
    <text class="label" x="24" y="34" font-size="18" font-weight="800">FastAPI</text>
    <text class="muted" x="24" y="58" font-size="14">Health, webhook, analysis</text>
  </g>

  <g transform="translate(430 205)">
    <rect class="box" x="0" y="0" width="300" height="170" rx="22"/>
    <text class="label" x="26" y="36" font-size="20" font-weight="800">Service Layer</text>
    <text class="muted" x="26" y="68" font-size="15">Portfolio + watchlist</text>
    <text class="muted" x="26" y="94" font-size="15">Paper trades + journal</text>
    <text class="muted" x="26" y="120" font-size="15">Daily check orchestration</text>
    <text class="muted" x="26" y="146" font-size="15">Scan + allocation services</text>
  </g>

  <g transform="translate(815 170)">
    <rect class="box" x="0" y="0" width="265" height="90" rx="18"/>
    <text class="label" x="22" y="35" font-size="18" font-weight="800">Market Data</text>
    <text class="muted" x="22" y="61" font-size="14">yfinance demo, Alpaca skeleton</text>
  </g>
  <g transform="translate(815 286)">
    <rect class="box" x="0" y="0" width="265" height="90" rx="18"/>
    <text class="label" x="22" y="35" font-size="18" font-weight="800">Quant Engine</text>
    <text class="muted" x="22" y="61" font-size="14">Indicators, scanner, backtester</text>
  </g>
  <g transform="translate(815 402)">
    <rect class="box" x="0" y="0" width="265" height="90" rx="18"/>
    <text class="label" x="22" y="35" font-size="18" font-weight="800">Risk Manager</text>
    <text class="muted" x="22" y="61" font-size="14">Deterministic sizing + rejection</text>
  </g>
  <g transform="translate(815 518)">
    <rect class="box" x="0" y="0" width="265" height="90" rx="18"/>
    <text class="label" x="22" y="35" font-size="18" font-weight="800">AI Explainer</text>
    <text class="muted" x="22" y="61" font-size="14">Fast, balanced, deep routing</text>
  </g>

  <g transform="translate(250 520)">
    <rect class="boxDark" x="0" y="0" width="230" height="78" rx="18"/>
    <text class="labelLight" x="24" y="33" font-size="17" font-weight="800">PostgreSQL</text>
    <text class="labelLight" x="24" y="57" font-size="14" opacity="0.75">Users, portfolios, trades</text>
  </g>
  <g transform="translate(520 520)">
    <rect class="boxDark" x="0" y="0" width="230" height="78" rx="18"/>
    <text class="labelLight" x="24" y="33" font-size="17" font-weight="800">Redis Cache</text>
    <text class="labelLight" x="24" y="57" font-size="14" opacity="0.75">Prices + indicator snapshots</text>
  </g>

  <path class="arrow" d="M330 230 C365 230 385 250 430 250"/>
  <path class="arrow" d="M330 345 C365 345 385 330 430 330"/>
  <path class="arrow" d="M730 252 C770 230 775 215 815 215"/>
  <path class="arrow" d="M730 290 C770 305 775 330 815 330"/>
  <path class="arrow" d="M730 330 C780 380 775 445 815 445"/>
  <path class="arrow" d="M730 366 C785 430 780 560 815 560"/>
  <path class="arrow" d="M530 375 C450 430 400 500 365 520"/>
  <path class="arrow" d="M615 375 C640 430 640 480 635 520"/>

  <rect x="840" y="650" width="260" height="30" rx="15" fill="#DDFBEF"/>
  <text x="862" y="671" class="label" font-size="14" font-weight="700">No real brokerage execution</text>
</svg>
